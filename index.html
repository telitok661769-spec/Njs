<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>আড্ডা — চ্যাট অ্যাপ</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      height: 100dvh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #e9d5ff 0%, #fbcfe8 50%, #fed7aa 100%);
      font-family: system-ui, -apple-system, sans-serif;
    }
    .chat-container {
      width: min(100%, 450px);
      height: 100%;
      max-height: 850px;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(168, 85, 247, 0.25);
      position: relative;
      border-radius: 32px;
    }
    header {
      background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
      padding: 16px 20px;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .avatar { width: 42px; height: 42px; border-radius: 50%; background: #fff; display: grid; place-items: center; font-weight: bold; color: #a855f7; }
    .header-info h2 { margin: 0; font-size: 16px; font-weight: 600; }
    .header-info p { margin: 2px 0 0; font-size: 11px; opacity: 0.9; }
    .logout-btn { background: rgba(255, 255, 255, 0.25); border: none; color: white; padding: 6px 10px; border-radius: 12px; cursor: pointer; font-size: 11px; font-weight: 600; }
    .view { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .hidden { display: none !important; }
    
    /* Login */
    .login-wrapper { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; background: linear-gradient(180deg, #e9d5ff 0%, #ffffff 100%); }
    .login-card { width: 100%; background: #ffffff; padding: 30px 20px; border-radius: 30px; box-shadow: 0 15px 35px rgba(168, 85, 247, 0.15); display: flex; flex-direction: column; gap: 14px; }
    .login-card h3 { margin: 0; text-align: center; color: #3b0764; font-size: 22px; }
    .login-card input { width: 100%; padding: 12px 16px; border: 1px solid #f3e8ff; border-radius: 16px; outline: none; background: #faf5ff; font-size: 14px; }
    .login-card button { width: 100%; padding: 12px; background: linear-gradient(90deg, #f472b6 0%, #c084fc 100%); color: white; border: none; border-radius: 16px; font-weight: bold; font-size: 15px; cursor: pointer; }

    /* Chat Room */
    #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; background: #faf5ff; }
    .message { max-width: 78%; padding: 10px 14px; border-radius: 16px; background: white; box-shadow: 0 2px 6px rgba(168, 85, 247, 0.08); }
    .message.mine { align-self: flex-end; background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%); color: white; }
    .text { font-size: 13.5px; word-break: break-word; }
    .message-img { max-width: 100%; border-radius: 10px; margin-top: 4px; display: block; }
    
    .chat-form { padding: 10px 14px; background: white; display: flex; align-items: center; gap: 8px; border-top: 1px solid #f3e8ff; }
    .chat-form input[type="text"] { flex: 1; padding: 10px 14px; border: 1px solid #f3e8ff; border-radius: 20px; outline: none; background: #faf5ff; font-size: 13px; }
    .attach-btn, .send-btn { background: #f3e8ff; color: #a855f7; border: none; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; }
    .send-btn { background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%); color: white; }
    .empty { margin: auto; text-align: center; color: #7e22ce; font-size: 13px; }
  </style>
</head>
<body>
  <div class="chat-container">
    <header>
      <div class="header-left">
        <div class="avatar">💬</div>
        <div class="header-info">
          <h2 id="headerTitle">আড্ডা</h2>
          <p id="headerSub">লগইন করুন</p>
        </div>
      </div>
      <button id="logoutBtn" class="logout-btn hidden">লগআউট</button>
    </header>

    <!-- Login View -->
    <div id="loginView" class="view">
      <div class="login-wrapper">
        <div class="login-card">
          <h3>স্বাগতম</h3>
          <input type="tel" id="loginPhone" placeholder="আপনার মোবাইল নম্বর" maxlength="15" />
          <input type="password" id="loginPass" placeholder="পাসওয়ার্ড" maxlength="20" />
          <button id="loginBtn">প্রবেশ করুন</button>
        </div>
      </div>
    </div>

    <!-- Chat Room View -->
    <div id="chatView" class="view hidden">
      <div style="padding: 10px; background: #f1f5f9; display: flex; gap: 6px;">
        <input type="tel" id="targetPhone" placeholder="চ্যাট করার নম্বর দিন" style="flex:1; padding:6px 10px; border:1px solid #cbd5e1; border-radius:8px; font-size:12px;" />
        <button id="connectBtn" style="padding:6px 12px; background:#a855f7; color:white; border:none; border-radius:8px; font-size:12px;">শুরু</button>
      </div>

      <div id="messages">
        <div class="empty">উপরে নম্বর দিয়ে চ্যাট শুরু করুন।</div>
      </div>

      <form id="chatForm" class="chat-form">
        <input type="file" id="imageInput" accept="image/*" style="display: none;" />
        <button type="button" id="attachBtn" class="attach-btn">📎</button>
        <input id="messageInput" type="text" placeholder="মেসেজ লিখুন..." autocomplete="off" />
        <button type="submit" class="send-btn">➤</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, query, where, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxx",
      authDomain: "jewel-minichat.firebaseapp.com",
      projectId: "jewel-minichat",
      storageBucket: "jewel-minichat.appspot.com",
      messagingSenderId: "xxxxxxxxxxxx",
      appId: "1:xxxxxxxxxxxx:web:xxxxxxxxxxxxxxxx"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let currentUser = JSON.parse(localStorage.getItem("chat_user")) || null;
    let activePartner = localStorage.getItem("chat_partner") || "";
    let unsubscribe = null;

    const loginView = document.getElementById("loginView");
    const chatView = document.getElementById("chatView");
    const loginPhone = document.getElementById("loginPhone");
    const loginPass = document.getElementById("loginPass");
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const headerTitle = document.getElementById("headerTitle");
    const headerSub = document.getElementById("headerSub");
    const targetPhone = document.getElementById("targetPhone");
    const connectBtn = document.getElementById("connectBtn");
    const messages = document.getElementById("messages");
    const chatForm = document.getElementById("chatForm");
    const messageInput = document.getElementById("messageInput");
    const attachBtn = document.getElementById("attachBtn");
    const imageInput = document.getElementById("imageInput");

    targetPhone.value = activePartner;

    if (currentUser) {
      showChat();
    }

    loginBtn.addEventListener("click", () => {
      const phone = loginPhone.value.trim();
      const pass = loginPass.value.trim();
      if (!phone || !pass) {
        alert("নম্বর ও পাসওয়ার্ড দিন!");
        return;
      }
      currentUser = { phone };
      localStorage.setItem("chat_user", JSON.stringify(currentUser));
      showChat();
    });

    logoutBtn.addEventListener("click", () => {
      localStorage.clear();
      location.reload();
    });

    function showChat() {
      loginView.classList.add("hidden");
      chatView.classList.remove("hidden");
      logoutBtn.classList.remove("hidden");
      headerTitle.textContent = `নম্বর: ${currentUser.phone}`;
      if (activePartner) loadMessages();
    }

    connectBtn.addEventListener("click", () => {
      const partner = targetPhone.value.trim();
      if (!partner || partner === currentUser.phone) {
        alert("সঠিক নম্বর দিন!");
        return;
      }
      activePartner = partner;
      localStorage.setItem("chat_partner", activePartner);
      loadMessages();
    });

    function getRoomId(u1, u2) {
      return [u1, u2].sort().join("_");
    }

    function loadMessages() {
      if (!activePartner) return;
      headerSub.textContent = `চ্যাট উইথ: ${activePartner}`;
      if (unsubscribe) unsubscribe();

      const roomId = getRoomId(currentUser.phone, activePartner);
      const q = query(collection(db, "secure_chats"), where("roomId", "==", roomId));

      unsubscribe = onSnapshot(q, (snapshot) => {
        messages.replaceChildren();
        if (snapshot.empty) {
          messages.innerHTML = `<div class="empty">কোনো বার্তা নেই। প্রথম বার্তা পাঠান!</div>`;
          return;
        }

        const list = [];
        snapshot.forEach(doc => list.push(doc.data()));
        list.sort((a, b) => (a.createdAt?.toMillis?.() || 0) - (b.createdAt?.toMillis?.() || 0));

        list.forEach(data => {
          const div = document.createElement("div");
          div.className = "message" + (data.sender === currentUser.phone ? " mine" : "");
          
          if (data.text) {
            const t = document.createElement("div");
            t.className = "text";
            t.textContent = data.text;
            div.append(t);
          }
          if (data.image) {
            const img = document.createElement("img");
            img.className = "message-img";
            img.src = data.image;
            div.append(img);
          }
          messages.append(div);
        });
        messages.scrollTop = messages.scrollHeight;
      });
    }

    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = messageInput.value.trim();
      if (!text || !activePartner) return;

      const roomId = getRoomId(currentUser.phone, activePartner);
      messageInput.value = "";
      await addDoc(collection(db, "secure_chats"), {
        roomId,
        sender: currentUser.phone,
        text,
        image: null,
        createdAt: serverTimestamp()
      });
    });

    attachBtn.addEventListener("click", () => {
      if (!activePartner) { alert("আগে চ্যাট নম্বর দিয়ে শুরু করুন!"); return; }
      imageInput.click();
    });

    imageInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async (event) => {
        const img = new Image();
        img.onload = async () => {
          const canvas = document.createElement('canvas');
          let w = img.width, h = img.height;
          if (w > 400) { h *= 400 / w; w = 400; }
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          const base64 = canvas.toDataURL('image/jpeg', 0.6);
          const roomId = getRoomId(currentUser.phone, activePartner);

          await addDoc(collection(db, "secure_chats"), {
            roomId,
            sender: currentUser.phone,
            text: "",
            image: base64,
            createdAt: serverTimestamp()
          });
          imageInput.value = "";
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });
  </script>
</body>
</html>
