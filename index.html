<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#a855f7">
<title>আড্ডা — বাংলা চ্যাট অ্যাপ</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;height:100dvh;
 font-family:system-ui,-apple-system,sans-serif;
 background:linear-gradient(135deg,#e9d5ff,#fbcfe8,#fed7aa);
 display:grid;place-items:center;
}
button,input{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.app{
 width:min(100%,450px);height:100%;max-height:900px;
 background:white;display:flex;flex-direction:column;
 overflow:hidden;position:relative;
 border-radius:24px;box-shadow:0 15px 45px #9333ea30;
}
header{
 background:linear-gradient(120deg,#9333ea,#ec4899);
 color:white;padding:15px 18px;
 display:flex;justify-content:space-between;align-items:center;
}
.brand{display:flex;align-items:center;gap:12px}
.logo{
 width:43px;height:43px;border-radius:50%;
 background:#ffffff35;display:grid;place-items:center;font-size:23px;
}
.brand h2{font-size:18px;margin:0}
.brand p{font-size:11px;margin:3px 0 0}
.actions{display:flex;gap:7px}
.actions button{
 border:0;border-radius:10px;padding:8px;
 color:white;background:#ffffff35;
}
.view{flex:1;min-height:0;display:flex;flex-direction:column}
.login{
 flex:1;display:grid;place-items:center;padding:22px;
 background:linear-gradient(#f3e8ff,#fff);
}
.card{
 width:100%;padding:28px 20px;border-radius:25px;
 background:white;box-shadow:0 12px 35px #9333ea20;
 display:flex;flex-direction:column;gap:14px;
}
.card h3{text-align:center;color:#581c87;margin:0 0 8px;font-size:24px}
.card input{
 width:100%;padding:13px;border:1px solid #e9d5ff;
 border-radius:13px;background:#faf5ff;outline:none;
}
.primary,.secondary{
 border:0;border-radius:13px;padding:13px;
 font-weight:bold;
}
.primary{background:linear-gradient(100deg,#c084fc,#ec4899);color:white}
.secondary{background:#f3e8ff;color:#7e22ce}
.chat-tools{
 padding:10px;display:flex;gap:7px;background:#f8fafc;
}
.chat-tools input{
 flex:1;min-width:0;padding:10px;border:1px solid #ddd6fe;
 border-radius:10px;outline:none;
}
.chat-tools button{
 border:0;border-radius:10px;background:#a855f7;
 color:white;padding:9px 13px;
}
#messages{
 flex:1;overflow-y:auto;padding:15px;
 display:flex;flex-direction:column;gap:10px;
 background:#faf5ff;
}
.message{
 max-width:82%;padding:10px 13px;border-radius:16px;
 background:white;box-shadow:0 2px 7px #9333ea12;
 overflow-wrap:anywhere;
}
.message.mine{
 align-self:flex-end;color:white;
 background:linear-gradient(120deg,#9333ea,#ec4899);
}
.message img{
 display:block;max-width:100%;max-height:260px;
 border-radius:10px;margin-top:5px;
}
.msg-time{font-size:10px;opacity:.7;margin-top:5px;text-align:right}
.empty{margin:auto;text-align:center;color:#9333ea;font-size:13px}
.chat-form{
 display:flex;align-items:center;gap:8px;
 padding:10px;background:white;border-top:1px solid #f3e8ff;
}
.chat-form input[type=text]{
 flex:1;min-width:0;padding:11px 14px;
 border:1px solid #e9d5ff;border-radius:22px;outline:none;
}
.round{
 width:40px;height:40px;border:0;border-radius:50%;
 display:grid;place-items:center;background:#f3e8ff;color:#9333ea;
}
.send{background:#a855f7;color:white;font-size:18px}
.call-modal{
 position:absolute;inset:0;z-index:10;
 background:#3b0764ee;color:white;
 display:flex;flex-direction:column;
 align-items:center;justify-content:center;gap:18px;
}
.call-avatar{
 width:100px;height:100px;border-radius:50%;
 display:grid;place-items:center;font-size:42px;
 background:linear-gradient(135deg,#f472b6,#a855f7);
}
.call-actions{display:flex;gap:15px}
.call-actions button{
 border:0;padding:13px 22px;border-radius:25px;
 color:white;font-weight:bold;
}
.accept{background:#16a34a}
.end{background:#ef4444}
.status{font-size:13px;color:#7e22ce;text-align:center;padding:5px}
button:disabled{opacity:.5}
</style>
</head>

<body>
<div class="app">

<header>
 <div class="brand">
  <div class="logo">💬</div>
  <div>
   <h2 id="headerTitle">আড্ডা</h2>
   <p id="headerSub">আপনার বন্ধুদের সাথে যুক্ত হন</p>
  </div>
 </div>
 <div class="actions">
  <button id="callBtn" class="hidden">📞</button>
  <button id="logoutBtn" class="hidden">লগআউট</button>
 </div>
</header>

<!-- LOGIN -->
<section id="loginView" class="view">
 <div class="login">
  <div class="card">
   <h3>স্বাগতম ❤️</h3>
   <input id="phone" type="tel" maxlength="15"
    placeholder="মোবাইল নম্বর" autocomplete="username">
   <input id="password" type="password" maxlength="50"
    placeholder="পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)"
    autocomplete="current-password">
   <button id="loginBtn" class="primary">প্রবেশ করুন</button>
   <button id="signupBtn" class="secondary">নতুন অ্যাকাউন্ট খুলুন</button>
   <div id="loginStatus" class="status"></div>
  </div>
 </div>
</section>

<!-- CHAT -->
<section id="chatView" class="view hidden">
 <div class="chat-tools">
  <input id="targetPhone" type="tel" placeholder="বন্ধুর মোবাইল নম্বর">
  <button id="connectBtn">শুরু</button>
 </div>

 <div id="messages">
  <div class="empty">বন্ধুর নম্বর দিয়ে চ্যাট শুরু করুন 💜</div>
 </div>

 <form id="chatForm" class="chat-form">
  <input type="file" id="imageInput" accept="image/*" hidden>
  <button type="button" id="attachBtn" class="round">📎</button>
  <input id="messageInput" type="text"
   placeholder="মেসেজ লিখুন..." maxlength="4000" autocomplete="off">
  <button type="submit" class="round send">➤</button>
 </form>
</section>

<!-- CALL -->
<div id="callModal" class="call-modal hidden">
 <div class="call-avatar">📞</div>
 <h2 id="callStatus">কলিং...</h2>
 <div id="callName"></div>
 <div class="call-actions">
  <button id="acceptBtn" class="accept hidden">রিসিভ</button>
  <button id="endBtn" class="end">কল কাটুন</button>
 </div>
 <audio id="remoteAudio" autoplay playsinline></audio>
</div>

</div>

<script type="module">
import {initializeApp}
 from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

import {
 getAuth,createUserWithEmailAndPassword,
 signInWithEmailAndPassword,onAuthStateChanged,signOut
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

import {
 getFirestore,collection,addDoc,query,where,
 onSnapshot,serverTimestamp,doc,setDoc,updateDoc,
 getDocs,deleteDoc
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

/* FIREBASE CONFIG */
const firebaseConfig={
 apiKey:"AIzaSyDLEgnZNLAxHQKYVycwVAw6-DaA4hjL10A",
 authDomain:"jewel-minichat.firebaseapp.com",
 projectId:"jewel-minichat",
 storageBucket:"jewel-minichat.firebasestorage.app",
 messagingSenderId:"691419481541",
 appId:"1:691419481541:web:509f57a4491fc1e9a377ac",
 measurementId:"G-5ZTKH477CC"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const $=id=>document.getElementById(id);

let me=null;
let partner=localStorage.getItem("adda_partner")||"";
let unsubChat=null,unsubIncoming=null;
let pc=null,localStream=null;
let activeCallRef=null;
let callUnsubs=[];
let callDocReady=false;
let pendingCandidates=[];
let ending=false;

const servers={
 iceServers:[
  {urls:"stun:stun.l.google.com:19302"}
 ]
};

const digits=s=>s.replace(/\D/g,"");
const roomId=(a,b)=>[a,b].sort().join("_");

function showStatus(message){
 $("loginStatus").textContent=message;
}

function showError(error){
 const messages={
  "auth/email-already-in-use":"এই নম্বরে অ্যাকাউন্ট আছে। প্রবেশ করুন।",
  "auth/invalid-credential":"নম্বর অথবা পাসওয়ার্ড ভুল।",
  "auth/weak-password":"পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের দিন।",
  "auth/invalid-email":"মোবাইল নম্বর সঠিক নয়।",
  "auth/too-many-requests":"অনেকবার চেষ্টা হয়েছে। পরে আবার চেষ্টা করুন।",
  "permission-denied":"Firebase Rules অনুমতি দেয়নি। Rules পরীক্ষা করুন।",
  "unavailable":"ইন্টারনেট সংযোগ পরীক্ষা করুন।"
 };
 alert(messages[error.code]||error.message||"সমস্যা হয়েছে। আবার চেষ্টা করুন।");
}

/* AUTHENTICATION */
async function authenticate(isNew){
 const phone=digits($("phone").value);
 const password=$("password").value;

 if(phone.length<8||phone.length>15||password.length<6){
  showStatus("সঠিক নম্বর ও কমপক্ষে ৬ অক্ষরের পাসওয়ার্ড দিন।");
  return;
 }

 const email=phone+"@adda.app";
 $("loginBtn").disabled=true;
 $("signupBtn").disabled=true;
 showStatus("অপেক্ষা করুন...");

 try{
  if(isNew){
   await createUserWithEmailAndPassword(auth,email,password);
  }else{
   await signInWithEmailAndPassword(auth,email,password);
  }
 }catch(error){
  showError(error);
 }finally{
  $("loginBtn").disabled=false;
  $("signupBtn").disabled=false;
  showStatus("");
 }
}

$("loginBtn").onclick=()=>authenticate(false);
$("signupBtn").onclick=()=>authenticate(true);
$("logoutBtn").onclick=()=>signOut(auth);

onAuthStateChanged(auth,user=>{
 if(user){
  me=user.email.split("@")[0];
  showChat();
  listenForIncomingCalls();
 }else{
  me=null;
  stopAll();
  $("loginView").classList.remove("hidden");
  $("chatView").classList.add("hidden");
  $("logoutBtn").classList.add("hidden");
  $("callBtn").classList.add("hidden");
  $("headerTitle").textContent="আড্ডা";
  $("headerSub").textContent="আপনার বন্ধুদের সাথে যুক্ত হন";
 }
});

function stopAll(){
 unsubChat?.();
 unsubIncoming?.();
 unsubChat=null;
 unsubIncoming=null;
 endCall();
}

function showChat(){
 $("loginView").classList.add("hidden");
 $("chatView").classList.remove("hidden");
 $("logoutBtn").classList.remove("hidden");
 $("callBtn").classList.remove("hidden");
 $("headerTitle").textContent="আড্ডা";
 $("headerSub").textContent="নম্বর: "+me;

 if(partner&&partner!==me){
  $("targetPhone").value=partner;
  loadMessages();
 }
}

/* CONNECT FRIEND */
$("connectBtn").onclick=()=>{
 const p=digits($("targetPhone").value);

 if(p.length<8||p.length>15||p===me){
  alert("সঠিক বন্ধুর মোবাইল নম্বর দিন।");
  return;
 }

 partner=p;
 localStorage.setItem("adda_partner",p);
 loadMessages();
};

/* CHAT */
function loadMessages(){
 if(!me||!partner)return;

 $("headerSub").textContent="চ্যাট: "+partner;
 unsubChat?.();

 const q=query(
  collection(db,"secure_chats"),
  where("roomId","==",roomId(me,partner)),
  where("members","array-contains",me)
 );

 unsubChat=onSnapshot(q,snap=>{
  $("messages").replaceChildren();

  if(snap.empty){
   const e=document.createElement("div");
   e.className="empty";
   e.textContent="কোনো বার্তা নেই। প্রথম বার্তা পাঠান 💜";
   $("messages").append(e);
   return;
  }

  const list=snap.docs.map(d=>d.data()).sort((a,b)=>{
   const at=a.createdAt?.toMillis?.()||0;
   const bt=b.createdAt?.toMillis?.()||0;
   return at-bt;
  });

  for(const data of list){
   const div=document.createElement("div");
   div.className="message"+(data.sender===me?" mine":"");

   if(data.text){
    const t=document.createElement("div");
    t.textContent=data.text;
    div.append(t);
   }

   if(data.image){
    const img=document.createElement("img");
    img.src=data.image;
    img.alt="পাঠানো ছবি";
    img.loading="lazy";
    div.append(img);
   }

   const time=document.createElement("div");
   time.className="msg-time";
   time.textContent=data.createdAt?.toDate
    ?data.createdAt.toDate().toLocaleTimeString("bn-BD",{hour:"2-digit",minute:"2-digit"})
    :"";
   div.append(time);

   $("messages").append(div);
  }

  $("messages").scrollTop=$("messages").scrollHeight;

 },error=>{
  console.error(error);
  showError(error);
 });
}

async function sendMessage(text,image=null){
 if(!partner||partner===me)return;

 const members=[me,partner].sort();

 await addDoc(collection(db,"secure_chats"),{
  roomId:members.join("_"),
  members:members,
  sender:me,
  text:text,
  image:image,
  createdAt:serverTimestamp()
 });
}

$("chatForm").onsubmit=async e=>{
 e.preventDefault();
 const text=$("messageInput").value.trim();

 if(!text)return;
 if(!partner){
  alert("আগে বন্ধুর নম্বর দিয়ে শুরু করুন।");
  return;
 }

 $("messageInput").value="";

 try{
  await sendMessage(text);
 }catch(error){
  $("messageInput").value=text;
  showError(error);
 }
};

/* IMAGE SENDING */
$("attachBtn").onclick=()=>{
 if(!partner){
  alert("আগে বন্ধুর নম্বর দিয়ে শুরু করুন।");
  return;
 }
 $("imageInput").click();
};

$("imageInput").onchange=e=>{
 const file=e.target.files[0];
 if(!file)return;

 if(!file.type.startsWith("image/")){
  alert("শুধু ছবি নির্বাচন করুন।");
  e.target.value="";
  return;
 }

 if(file.size>10*1024*1024){
  alert("ছবির আকার ১০ MB-এর কম হতে হবে।");
  e.target.value="";
  return;
 }

 const reader=new FileReader();

 reader.onload=ev=>{
  const img=new Image();

  img.onload=async()=>{
   let w=img.width,h=img.height;
   const max=700;

   if(w>max||h>max){
    const scale=Math.min(max/w,max/h);
    w=Math.round(w*scale);
    h=Math.round(h*scale);
   }

   const canvas=document.createElement("canvas");
   canvas.width=w;
   canvas.height=h;
   canvas.getContext("2d").drawImage(img,0,0,w,h);

   const data=canvas.toDataURL("image/jpeg",0.55);

   if(data.length>700000){
    alert("ছবিটি অনেক বড়। ছোট ছবি নির্বাচন করুন।");
    e.target.value="";
    return;
   }

   try{
    await sendMessage("",data);
   }catch(error){
    showError(error);
   }

   $("imageInput").value="";
  };

  img.onerror=()=>{
   alert("ছবিটি পড়া যায়নি।");
   $("imageInput").value="";
  };

  img.src=ev.target.result;
 };

 reader.onerror=()=>{
  alert("ছবি পড়তে সমস্যা হয়েছে।");
  $("imageInput").value="";
 };

 reader.readAsDataURL(file);
};

/* AUDIO CALL - WEBRTC */
function newPeer(){
 pc=new RTCPeerConnection(servers);

 localStream.getTracks().forEach(track=>{
  pc.addTrack(track,localStream);
 });

 pc.ontrack=event=>{
  $("remoteAudio").srcObject=event.streams[0];
  $("remoteAudio").play().catch(()=>{});
 };
}

async function saveCandidate(sub,candidate){
 if(!activeCallRef)return;

 const ref=activeCallRef;

 if(!callDocReady){
  pendingCandidates.push({sub,candidate});
  return;
 }

 await addDoc(collection(ref,sub),candidate);
}

async function flushCandidates(){
 callDocReady=true;
 const items=pendingCandidates.splice(0);

 for(const item of items){
  if(!activeCallRef)break;
  await addDoc(
   collection(activeCallRef,item.sub),
   item.candidate
  );
 }
}

function watchCandidates(sub){
 if(!activeCallRef)return;

 const ref=activeCallRef;

 callUnsubs.push(onSnapshot(
  collection(ref,sub),
  snap=>{
   snap.docChanges().forEach(change=>{
    if(change.type==="added"&&pc){
     pc.addIceCandidate(
      new RTCIceCandidate(change.doc.data())
     ).catch(console.error);
    }
   });
  },
  console.error
 ));
}

function watchCallEnd(){
 if(!activeCallRef)return;

 const ref=activeCallRef;

 callUnsubs.push(onSnapshot(ref,snap=>{
  if(!snap.exists()&&pc){
   closeCall();
  }
 }));
}

function showCall(status,name){
 $("callModal").classList.remove("hidden");
 $("callStatus").textContent=status;
 $("callName").textContent=name||"";
}

$("callBtn").onclick=async()=>{
 if(!partner||partner===me){
  alert("আগে বন্ধুর নম্বর দিয়ে শুরু করুন।");
  return;
 }

 if(pc||activeCallRef)return;

 try{
  showCall("কল করা হচ্ছে...",partner);
  $("acceptBtn").classList.add("hidden");

  localStream=await navigator.mediaDevices.getUserMedia({
   audio:true,video:false
  });

  newPeer();

  activeCallRef=doc(collection(db,"calls"));
  callDocReady=false;
  pendingCandidates=[];

  pc.onicecandidate=event=>{
   if(event.candidate){
    saveCandidate(
     "offerCandidates",
     event.candidate.toJSON()
    ).catch(console.error);
   }
  };

  const offer=await pc.createOffer();
  await pc.setLocalDescription(offer);

  await setDoc(activeCallRef,{
   caller:me,
   callee:partner,
   offer:{
    type:offer.type,
    sdp:offer.sdp
   },
   createdAt:serverTimestamp()
  });

  await flushCandidates();

  const ref=activeCallRef;

  callUnsubs.push(onSnapshot(ref,async snap=>{
   if(!snap.exists()){
    if(pc)closeCall();
    return;
   }

   const data=snap.data();

   if(data?.answer&&pc&&!pc.currentRemoteDescription){
    await pc.setRemoteDescription(
     new RTCSessionDescription(data.answer)
    );
    watchCandidates("answerCandidates");
    $("callStatus").textContent="কথা বলছেন...";
   }
  }));

  watchCallEnd();

  setTimeout(()=>{
   if(activeCallRef===ref&&pc){
    alert("উত্তর পাওয়া যায়নি।");
    endCall();
   }
  },45000);

 }catch(error){
  console.error(error);
  alert("মাইক্রোফোন অনুমতি দিন এবং HTTPS সংযোগ পরীক্ষা করুন।");
  endCall();
 }
};

/* INCOMING CALL */
function listenForIncomingCalls(){
 unsubIncoming?.();

 const q=query(
  collection(db,"calls"),
  where("callee","==",me)
 );

 unsubIncoming=onSnapshot(q,snap=>{
  snap.docChanges().forEach(change=>{
   if(change.type!=="added")return;

   const data=change.doc.data();

   const age=Date.now()-
    (data.createdAt?.toMillis?.()||Date.now());

   if(pc||activeCallRef||data.answer||age>60000)return;

   activeCallRef=change.doc.ref;
   callDocReady=true;
   pendingCandidates=[];

   partner=data.caller;
   localStorage.setItem("adda_partner",partner);
   $("targetPhone").value=partner;

   loadMessages();

   showCall("আপনার কাছে কল এসেছে",partner);
   $("acceptBtn").classList.remove("hidden");

   watchCallEnd();

   $("acceptBtn").onclick=()=>acceptCall(data);
  });
 },error=>{
  console.error(error);
 });
}

async function acceptCall(data){
 if(!activeCallRef||pc)return;

 $("acceptBtn").disabled=true;
 $("acceptBtn").classList.add("hidden");
 $("callStatus").textContent="কল সংযোগ হচ্ছে...";

 try{
  localStream=await navigator.mediaDevices.getUserMedia({
   audio:true,video:false
  });

  newPeer();

  pc.onicecandidate=event=>{
   if(event.candidate){
    saveCandidate(
     "answerCandidates",
     event.candidate.toJSON()
    ).catch(console.error);
   }
  };

  await pc.setRemoteDescription(
   new RTCSessionDescription(data.offer)
  );

  watchCandidates("offerCandidates");

  const answer=await pc.createAnswer();
  await pc.setLocalDescription(answer);

  await updateDoc(activeCallRef,{
   answer:{
    type:answer.type,
    sdp:answer.sdp
   }
  });

  await flushCandidates();

  $("callStatus").textContent="কথা বলছেন...";

 }catch(error){
  console.error(error);
  alert("কল রিসিভ করা যায়নি। মাইক্রোফোন অনুমতি পরীক্ষা করুন।");
  endCall();
 }finally{
  $("acceptBtn").disabled=false;
 }
}

/* END CALL */
function closeCall(){
 callUnsubs.forEach(unsub=>unsub());
 callUnsubs=[];

 localStream?.getTracks().forEach(track=>track.stop());
 localStream=null;

 pc?.close();
 pc=null;

 $("remoteAudio").srcObject=null;
 $("callModal").classList.add("hidden");
 $("acceptBtn").classList.add("hidden");
 $("callStatus").textContent="কলিং...";
 $("acceptBtn").disabled=false;

 activeCallRef=null;
 callDocReady=false;
 pendingCandidates=[];
}

async function endCall(){
 if(ending)return;

 const ref=activeCallRef;

 if(!ref){
  if(pc||localStream)closeCall();
  return;
 }

 ending=true;
 closeCall();

 try{
  for(const sub of ["offerCandidates","answerCandidates"]){
   const snap=await getDocs(collection(ref,sub));
   await Promise.all(
    snap.docs.map(d=>deleteDoc(d.ref))
   );
  }

  await deleteDoc(ref);

 }catch(error){
  console.error("কল শেষ করার সমস্যা:",error);
 }finally{
  ending=false;
 }
}

$("endBtn").onclick=endCall;

</script>
</body>
</html>
